<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --bg:#0a0a0a; --text:#fff; --muted:#a1a1aa; --accent:#7c3aed; --accent-text:#a78bfa; --sans:"Inter",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
      #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--sans); }
      .abs { position:absolute; }

      .gx { position:absolute; left:-90px; top:-85px; width:2100px; height:1250px; }
      .tw { position:absolute; border-radius:50%; background:#fff; }

      #cam { left:0; top:0; width:1920px; height:1080px; transform-origin:960px 510px; }
      svg#lines { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:visible; }
      svg#lines path { fill:none; stroke:url(#lg); stroke-width:2; stroke-linecap:round; }
      .star { position:absolute; width:0; height:0; opacity:0; }
      .star .halo { position:absolute; left:-70px; top:-70px; width:140px; height:140px; border-radius:50%; background:radial-gradient(circle,rgba(233,226,255,.30),rgba(167,139,250,.10) 40%,transparent 70%); }
      .star .core { position:absolute; left:-6px; top:-6px; width:12px; height:12px; border-radius:50%; background:#fff; box-shadow:0 0 22px 6px rgba(233,226,255,.9); }
      .star .fh, .star .fv { position:absolute; background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent); }
      .star .fh { left:-60px; top:-1px; width:120px; height:2px; }
      .star .fv { left:-1px; top:-60px; width:2px; height:120px; background:linear-gradient(180deg,transparent,rgba(255,255,255,.95),transparent); }

      #ring { left:960px; top:480px; width:200px; height:200px; margin:-100px 0 0 -100px; border-radius:50%; border:2px solid rgba(196,181,253,.9); opacity:0; }
      #logo { left:960px; top:480px; width:880px; opacity:0; filter:drop-shadow(0 0 50px rgba(167,139,250,.6)); }
      #sheen { left:560px; top:330px; width:150px; height:300px; background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(-18deg); opacity:0; mix-blend-mode:overlay; }

      .cap { left:0; width:1920px; text-align:center; opacity:0; }
      #t1 { top:600px; font-size:60px; font-weight:500; letter-spacing:-.02em; }
      #t2 { top:900px; font-size:56px; font-weight:500; letter-spacing:-.02em; }
      #t2 span, #t1 span { color:var(--accent-text); }
      #head { top:640px; font-size:128px; font-weight:600; letter-spacing:-.05em; line-height:1; }
      #head b { font-weight:600; background:linear-gradient(100deg,#c4b5fd,#7c3aed 60%,#a78bfa); -webkit-background-clip:text; background-clip:text; color:transparent; }
      #three { top:812px; font-size:52px; font-weight:500; letter-spacing:-.01em; }
      #three span { color:var(--accent-text); }
      #tag { top:900px; font-size:34px; color:var(--muted); }
      #pill { left:50%; top:960px; display:flex; align-items:center; gap:16px; padding:14px 32px; border-radius:999px; border:1px solid rgba(167,139,250,.45); background:rgba(124,58,237,.16); font-family:var(--mono); font-size:24px; letter-spacing:.28em; color:#e9e2ff; white-space:nowrap; box-shadow:0 0 50px rgba(124,58,237,.35); opacity:0; }
      #pill i { width:12px; height:12px; border-radius:50%; background:var(--accent-text); box-shadow:0 0 16px 4px rgba(167,139,250,.9); display:block; }
      #vig { inset:0; background:radial-gradient(ellipse at 50% 46%,transparent 52%,rgba(0,0,0,.72)); pointer-events:none; }
      .nm { position:absolute; font-family:var(--mono); font-size:17px; letter-spacing:.22em; color:rgba(196,181,253,.8); white-space:nowrap; opacity:0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080">
      <canvas id="g1" class="gx" width="2100" height="1250"></canvas>
      <canvas id="g2" class="gx" width="2100" height="1250"></canvas>
      <canvas id="g3" class="gx" width="2100" height="1250"></canvas>
      <div id="twk"></div>
      <div id="vig" class="abs"></div>

      <div id="cam" class="abs">
        <svg id="lines" viewBox="0 0 1920 1080"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9e2ff" stop-opacity=".85"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".4"/><stop offset="1" stop-color="#e9e2ff" stop-opacity=".85"/></linearGradient></defs></svg>
      </div>

      <div id="ring" class="abs"></div>
      <img id="logo" class="abs" src="assets/media/logo.png" alt="Orion" />
      <div id="sheen" class="abs"></div>

      <div id="t1" class="cap abs">Every day, new businesses open.</div>
      <div id="t2" class="cap abs">Be the first to <span>find them.</span></div>
      <div id="head" class="cap abs">A new star <b>is rising.</b></div>
      <div id="three" class="cap abs">Discover. Enrich. <span>Act.</span></div>
      <div id="tag" class="cap abs">Business intelligence for modern sales teams.</div>
      <div id="pill" class="abs"><i></i>LAUNCHING SOON</div>

      <audio id="music" src="assets/music/bed.mp3" data-start="0" data-duration="18" data-track-index="1" data-volume="0.55" data-fade-in="1" data-fade-out="2"></audio>
      <audio id="s1" src="assets/sfx/star.ogg" data-start="4.23" data-duration="0.22" data-track-index="2" data-volume="0.28"></audio>
      <audio id="s2" src="assets/sfx/star.ogg" data-start="4.75" data-duration="0.22" data-track-index="3" data-volume="0.28"></audio>
      <audio id="s3" src="assets/sfx/star.ogg" data-start="5.28" data-duration="0.22" data-track-index="4" data-volume="0.28"></audio>
      <audio id="s4" src="assets/sfx/star.ogg" data-start="5.8" data-duration="0.22" data-track-index="5" data-volume="0.28"></audio>
      <audio id="s5" src="assets/sfx/star.ogg" data-start="6.34" data-duration="0.22" data-track-index="6" data-volume="0.28"></audio>
      <audio id="s6" src="assets/sfx/star.ogg" data-start="6.86" data-duration="0.22" data-track-index="7" data-volume="0.28"></audio>
      <audio id="s7" src="assets/sfx/star.ogg" data-start="7.4" data-duration="0.22" data-track-index="8" data-volume="0.28"></audio>
      <audio id="sl" src="assets/sfx/logo.ogg" data-start="10.54" data-duration="0.05" data-track-index="9" data-volume="0.35"></audio>
    </div>

    <script>
      const $ = (s) => document.querySelector(s);
      const tl = gsap.timeline({ paused: true });
      const ease = "power3.out";
      gsap.set("#logo", { xPercent: -50, yPercent: -50 });
      gsap.set("#pill", { xPercent: -50 });

      // ---------- galaxy (seeded, drawn once) ----------
      let sd = 20261004; const rnd = () => (sd = (sd * 1664525 + 1013904223) % 4294967296) / 4294967296;
      const gauss = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(6.2831853 * rnd());
      const CW = 2100, CH = 1250, ANG = -0.5; // band rises to the right
      const cos = Math.cos(ANG), sin = Math.sin(ANG);
      const bandPt = (t, o) => [CW / 2 + t * cos - o * sin, CH / 2 + t * sin + o * cos];
      const cols = ["#ffffff", "#ffffff", "#dbe6ff", "#c9d8ff", "#ffe9d2", "#e4d9ff"];
      const ctx = (id) => $("#" + id).getContext("2d");
      const dot = (g, x, y, r, a, col) => { g.globalAlpha = a; g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
      const glowEllipse = (g, cx, cy, rx, ry, rgba, rot) => {
        g.save(); g.translate(cx, cy); g.rotate(rot); g.scale(rx / ry, 1);
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, ry); gr.addColorStop(0, rgba); gr.addColorStop(1, "rgba(10,10,10,0)");
        g.fillStyle = gr; g.fillRect(-ry * 3, -ry, ry * 6, ry * 2); g.restore();
      };
      // layer 1: deep field + galactic band glow
      (() => {
        const g = ctx("g1");
        g.fillStyle = "#0a0a0a"; g.fillRect(0, 0, CW, CH);
        glowEllipse(g, CW / 2, CH / 2, 1500, 330, "rgba(74,52,150,.22)", ANG);
        glowEllipse(g, CW / 2, CH / 2, 1250, 200, "rgba(124,58,237,.20)", ANG);
        glowEllipse(g, CW / 2, CH / 2, 900, 105, "rgba(196,181,253,.13)", ANG);
        glowEllipse(g, CW / 2 - 150, CH / 2 + 60, 380, 80, "rgba(255,228,200,.07)", ANG);
        for (let i = 0; i < 46; i++) {
          const [x, y] = bandPt((rnd() - .5) * 2400, gauss() * 120);
          glowEllipse(g, x, y, 60 + rnd() * 90, 30 + rnd() * 50, "rgba(" + (rnd() < .5 ? "150,120,240" : "110,130,255") + "," + (.03 + rnd() * .04) + ")", ANG + (rnd() - .5) * .6);
        }
        glowEllipse(g, CW / 2, CH / 2 + 18, 1400, 26, "rgba(6,5,12,.55)", ANG);
        for (let i = 0; i < 2600; i++) {
          let x, y;
          if (rnd() < .5) { [x, y] = bandPt((rnd() - .5) * 2600, gauss() * 190); } else { x = rnd() * CW; y = rnd() * CH; }
          dot(g, x, y, rnd() * .5 + .3, .22 + rnd() * .38, cols[(rnd() * cols.length) | 0]);
        }
        g.globalAlpha = 1;
      })();
      // layer 2: mid stars
      (() => {
        const g = ctx("g2");
        for (let i = 0; i < 1700; i++) {
          let x, y;
          if (rnd() < .45) { [x, y] = bandPt((rnd() - .5) * 2500, gauss() * 230); } else { x = rnd() * CW; y = rnd() * CH; }
          dot(g, x, y, rnd() * .7 + .5, .4 + rnd() * .5, cols[(rnd() * cols.length) | 0]);
        }
        g.globalAlpha = 1;
      })();
      // layer 3: bright stars with soft glow
      const bright = [];
      (() => {
        const g = ctx("g3");
        for (let i = 0; i < 260; i++) {
          let x, y;
          if (rnd() < .4) { [x, y] = bandPt((rnd() - .5) * 2400, gauss() * 260); } else { x = rnd() * CW; y = rnd() * CH; }
          const r = rnd() * .9 + .9, col = cols[(rnd() * cols.length) | 0];
          const gr = g.createRadialGradient(x, y, 0, x, y, r * 5); gr.addColorStop(0, "rgba(255,255,255,.35)"); gr.addColorStop(1, "rgba(255,255,255,0)");
          g.globalAlpha = .5 + rnd() * .5; g.fillStyle = gr; g.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
          dot(g, x, y, r, .95, col);
          if (i < 60) bright.push([x - 90, y - 85]);
        }
        g.globalAlpha = 1;
      })();
      // twinkle layer (finite, seek-safe)
      bright.forEach(([x, y]) => {
        if (x < 0 || x > 1920 || y < 0 || y > 1080) return;
        const d = document.createElement("div"); d.className = "tw";
        const r = 1.6 + rnd() * 1.4; d.style.cssText = "left:" + (x - r / 2) + "px;top:" + (y - r / 2) + "px;width:" + r + "px;height:" + r + "px;opacity:.2;box-shadow:0 0 " + (r * 4) + "px " + r + "px rgba(214,200,255,.55)";
        $("#twk").appendChild(d);
        tl.to(d, { opacity: 1, duration: 0.9 + rnd() * 1.4, ease: "sine.inOut", yoyo: true, repeat: 7 }, rnd() * 3);
      });
      tl.fromTo(["#g1", "#g2", "#g3"], { opacity: 0 }, { opacity: 1, duration: 2.4, ease: "sine.inOut" }, 0);
      tl.to("#g1", { x: 28, y: -14, duration: 18, ease: "none" }, 0);
      tl.to("#g2", { x: 56, y: -28, duration: 18, ease: "none" }, 0);
      tl.to("#g3", { x: 96, y: -48, duration: 18, ease: "none" }, 0);
      tl.to("#twk", { x: 96, y: -48, duration: 18, ease: "none" }, 0);

      // ---------- complete Orion constellation ----------
      const X0 = 520, Y0 = 110, W = 880, H = 800;
      const P = (nx, ny) => [X0 + nx * W, Y0 + ny * H];
      // name: [point, scale, ignite time, label]
      const defs = {
        alnilam: [P(.51, .50), 1.15, 0.3, "RETAIL"], alnitak: [P(.44, .52), .95, 4.23, "MACHINERY"], mintaka: [P(.58, .48), .9, 4.5, "PACKAGING"],
        sw1: [P(.51, .60), .5, 4.76], sw2: [P(.51, .66), .62, 5.0], sw3: [P(.51, .72), .5, 5.28],
        betel: [P(.34, .16), 1.4, 5.5, "MANUFACTURING"], bella: [P(.68, .19), 1.0, 5.8, "WHOLESALE"], meissa: [P(.50, .04), .7, 6.07, "SERVICES"],
        arm1: [P(.22, .09), .55, 6.34], arm2: [P(.14, .17), .5, 6.55],
        sh1: [P(.84, .15), .55, 6.86], sh2: [P(.90, .30), .55, 7.07], sh3: [P(.92, .46), .55, 7.28], sh4: [P(.88, .60), .5, 7.5],
        saiph: [P(.38, .88), .95, 7.7, "LOGISTICS"], rigel: [P(.70, .84), 1.45, 7.92, "EXPORT"],
      };
      const cam = $("#cam"), svg = $("#lines");
      Object.entries(defs).forEach(([name, [[x, y], sc, t, label]]) => {
        const s = document.createElement("div"); s.className = "star"; s.id = "st_" + name;
        s.style.left = x + "px"; s.style.top = y + "px";
        s.innerHTML = '<div class="halo"></div><div class="fh"></div><div class="fv"></div><div class="core"></div>';
        cam.appendChild(s);
        tl.fromTo(s, { opacity: 0, scale: 0 }, { opacity: 1, scale: sc, duration: 0.6, ease: "back.out(2.2)" }, t);
        tl.to(s.querySelector(".halo"), { scale: 1.25, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, t + 0.6);
        if (label && name !== "alnilam") {
          const n = document.createElement("div"); n.className = "nm"; n.textContent = label;
          const right = x > 960, off = 30 + sc * 22; n.style.left = (right ? x + off : x - off) + "px"; n.style.top = (y - 10) + "px";
          if (!right) n.style.transform = "translateX(-100%)";
          if (name === "betel") { n.style.left = (x - 34) + "px"; n.style.top = (y + 30) + "px"; n.style.transform = "translateX(-100%)"; }
          cam.appendChild(n); tl.to(n, { opacity: 1, duration: 0.6, ease }, t + 0.35);
        }
      });
      const segs = [
        ["alnitak","alnilam"],["alnilam","mintaka"],["alnilam","sw1"],["sw1","sw2"],["sw2","sw3"],
        ["betel","alnitak"],["bella","mintaka"],["betel","meissa"],["meissa","bella"],
        ["betel","arm1"],["arm1","arm2"],["bella","sh1"],["sh1","sh2"],["sh2","sh3"],["sh3","sh4"],
        ["alnitak","saiph"],["mintaka","rigel"],
      ];
      segs.forEach(([a, b]) => {
        const pa = defs[a][0], pb = defs[b][0];
        const len = Math.hypot(pb[0] - pa[0], pb[1] - pa[1]);
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        p.setAttribute("d", "M" + pa[0] + " " + pa[1] + " L" + pb[0] + " " + pb[1]);
        p.setAttribute("stroke-dasharray", len); p.setAttribute("stroke-dashoffset", len);
        svg.appendChild(p);
        tl.to(p, { attr: { "stroke-dashoffset": 0 }, duration: 0.5, ease: "power2.out" }, Math.max(defs[a][2], defs[b][2]) + 0.12);
      });

      // text 1
      tl.fromTo("#t1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1, ease }, 0.8);
      tl.to("#t1", { opacity: 0, y: -16, duration: 0.6, ease: "power2.in" }, 3.2);
      // text 2
      tl.fromTo("#t2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease }, 6.34);
      tl.to("#t2", { opacity: 0, duration: 0.4, ease: "power2.in" }, 9.2);

      // beat-locked 8.44: camera pushes through the belt
      tl.to("#cam", { scale: 1.9, duration: 2.1, ease: "power2.in" }, 8.44);
      tl.to("#cam", { opacity: 0, duration: 0.7, ease: "power2.in" }, 9.9);

      // beat-locked 10.54: logo reveal
      tl.fromTo("#ring", { opacity: 0.95, scale: 0.2 }, { opacity: 0, scale: 14, duration: 1.8, ease: "power2.out" }, 10.54);
      tl.fromTo("#logo", { opacity: 0, scale: 0.88 }, { opacity: 1, scale: 1, duration: 1.1, ease }, 10.62);
      tl.fromTo("#sheen", { x: -200, opacity: 0 }, { x: 1200, opacity: 0.9, duration: 1.3, ease: "power2.inOut" }, 11.0);
      tl.to("#sheen", { opacity: 0, duration: 0.2 }, 12.35);
      // beat-locked 12.65: logo lifts, headline
      tl.to("#logo", { y: -250, scale: 0.55, duration: 1.0, ease: "power3.inOut" }, 12.65);
      tl.fromTo("#head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.9, ease }, 13.1);
      tl.fromTo("#three", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease }, 14.76);
      tl.fromTo("#tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease }, 15.81);
      tl.fromTo("#pill", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease }, 16.34);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
