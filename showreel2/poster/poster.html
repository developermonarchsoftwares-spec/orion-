<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Orion Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0a0a0a; --surface:#141414; --text:#fff; --muted:#a1a1aa; --accent:#7c3aed; --accent-text:#a78bfa; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1800px; height:2400px; background:var(--bg); }
  #p { position:relative; width:1800px; height:2400px; overflow:hidden; background:var(--bg); color:var(--text); font-family:"Inter",system-ui,sans-serif; }
  .abs { position:absolute; }
  #glow { left:-200px; top:900px; width:2200px; height:1500px; background:radial-gradient(ellipse at 55% 45%, rgba(124,58,237,.30), transparent 62%); }
  #glow2 { left:600px; top:-300px; width:1600px; height:1000px; background:radial-gradient(ellipse at center, rgba(124,58,237,.14), transparent 65%); }
  #vig { inset:0; background:radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.6)); }
  #grid { inset:0; opacity:.22; background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px); background-size:150px 150px; -webkit-mask-image:radial-gradient(ellipse at 50% 55%,#000 10%,transparent 70%); mask-image:radial-gradient(ellipse at 50% 55%,#000 10%,transparent 70%); }
  #logo { left:120px; top:104px; width:470px; }
  #kicker { right:120px; top:150px; font-family:"JetBrains Mono",monospace; font-size:24px; letter-spacing:.2em; color:var(--muted); }
  #h { left:112px; top:330px; font-size:226px; font-weight:600; letter-spacing:-.055em; line-height:.94; }
  #h span { color:var(--accent-text); }
  #lede { left:124px; top:1030px; font-size:44px; line-height:1.3; color:var(--muted); width:1000px; }
  .frame { border-radius:26px; overflow:hidden; background:#fff; box-shadow:0 0 0 1px rgba(255,255,255,.16), 0 50px 140px rgba(0,0,0,.8), 0 0 180px rgba(124,58,237,.28); }
  .frame img { display:block; width:100%; height:100%; object-fit:cover; object-position:left top; }
  #fMain { left:120px; top:1230px; width:1560px; height:878px; }
  #fMain::after, #fSide::after { content:""; position:absolute; inset:0; background:linear-gradient(115deg, rgba(255,255,255,.12), rgba(255,255,255,0) 34%, rgba(255,255,255,0) 72%, rgba(124,58,237,.08)); }
  #fSide { left:1190px; top:1500px; width:490px; height:596px; border-radius:22px; box-shadow:0 0 0 1px rgba(255,255,255,.2), 0 40px 120px rgba(0,0,0,.85), 0 0 140px rgba(124,58,237,.35); }
  #fSide img { object-position:center top; }
  #tag { left:120px; top:2186px; font-size:56px; font-weight:500; letter-spacing:-.02em; }
  #note { left:120px; top:2292px; font-family:"JetBrains Mono",monospace; font-size:22px; letter-spacing:.1em; color:#9a9aa4; }
  #url { right:120px; top:2292px; font-family:"JetBrains Mono",monospace; font-size:22px; letter-spacing:.1em; color:#9a9aa4; }
</style>
</head>
<body>
<div id="p">
  <div id="grid" class="abs"></div>
  <div id="glow" class="abs"></div>
  <div id="glow2" class="abs"></div>
  <div id="vig" class="abs"></div>
  <img id="logo" class="abs" src="logo.png" alt="Orion" />
  <div id="kicker" class="abs">FRESH BUSINESS INTELLIGENCE</div>
  <div id="h" class="abs">Discover.<br />Enrich.<br /><span>Act.</span></div>
  <div id="lede" class="abs">Search by industry and location. See newly registered businesses with the people to contact.</div>
  <div id="fMain" class="frame abs"><img src="stillResults.png" alt="Orion discovery screen" /></div>
  <div id="fSide" class="frame abs"><img src="drawer.png" alt="Orion unlocked lead drawer" /></div>
  <div id="tag" class="abs">Business intelligence for modern sales teams.</div>
  <div id="note" class="abs">PRODUCT UI SHOWN WITH DEMO DATA</div>
</div>
</body>
</html>
