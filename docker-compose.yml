services:
  postgres:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.docker.example)}"
      POSTGRES_DB: orion_db
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/database/migrations/0000_bent_johnny_storm.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./apps/api/src/database/migrations/0001_blushing_loa.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - ./apps/api/src/database/migrations/0002_typical_clint_barton.sql:/docker-entrypoint-initdb.d/03-init.sql:ro
      - ./apps/api/src/database/migrations/0003_seed_packages.sql:/docker-entrypoint-initdb.d/04-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:26.0
    container_name: orion-typesense
    restart: always
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: "${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY (see .env.docker.example)}"
      TYPESENSE_ENABLE_CORS: "true"
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c 'exec 3<>/dev/tcp/localhost/8108'"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: orion-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD (see .env.docker.example)}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: orion-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      APP_NAME: Orion Backend API
      APP_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.docker.example)}@postgres:5432/orion_db"
      SEARCH_PROVIDER: postgres
      TYPESENSE_NODES: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: "${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY (see .env.docker.example)}"
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: orion-assets
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD (see .env.docker.example)}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET (see .env.docker.example)}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET (see .env.docker.example)}"
    depends_on:
      postgres:
        condition: service_healthy
      typesense:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/v1/health/liveness', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: ownus/Dockerfile
    container_name: orion-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_API_URL: http://api:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET (see .env.docker.example)}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET (see .env.docker.example)}"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  typesense_data:
  minio_data:
