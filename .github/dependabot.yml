# Dependabot proposes updates as pull requests; nothing is merged automatically. Every proposal goes through the same required checks
# and review as any other change (see docs/CI_CD_SECURITY_REVIEW.md). Weekly, few at a time, so a review is possible.
version: 2
updates:
  - package-ecosystem: github-actions   # keeps the pinned action commits current
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm              # root workspace (API, shared package)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm              # the web app has its own lockfile
    directory: /ownus
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
